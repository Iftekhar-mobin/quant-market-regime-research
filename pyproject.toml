[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qmr"
version = "0.4.0"
description = "Research framework for market-regime conditioned systematic strategies on FX and commodity time series"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Iftekharul Mobin", email = "iftekhar.mobin@gmail.com" }]
keywords = ["quantitative-research", "market-regimes", "time-series", "walk-forward", "backtesting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "statsmodels>=0.14",
    "pyyaml>=6.0",
    "joblib>=1.2",
    "plotly>=5.18",
    "streamlit>=1.36",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
sequence = ["tensorflow>=2.12,<2.16"]
mt5 = ["MetaTrader5>=5.0.45"]
dev = ["ruff>=0.4", "black>=24.0", "pytest>=8.0"]

[project.scripts]
qmr = "qmr.cli:main"

[project.urls]
Homepage = "https://github.com/Iftekhar-mobin/quant-market-regime-research"
Documentation = "https://github.com/Iftekhar-mobin/quant-market-regime-research/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = [
    "E501",   # line length is handled by black
    "C408",   # dict(...) is the Plotly figure-spec convention
]
